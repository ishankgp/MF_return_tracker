[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
norecursedirs = experiments .git .venv39 venv logs node_modules
addopts = -v --strict-markers
markers =
    unit: Fast unit tests
    regression: Core regression test suite
    integration: Integration tests between services, db, and API
    api: Flask REST API endpoint tests
    slow: Tests that take longer to run
