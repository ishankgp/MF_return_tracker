        <div class="notes-section mt-4">
            <div class="card data-card">
                <div class="card-header table-card-header">
                    <div>
                        <h2 class="card-title"><i class="bi bi-journal-text me-2"></i>Notes</h2>
                        <p class="card-subtitle">Capture review notes, fund thesis changes, or data anomalies.</p>
                    </div>
                </div>
                <div class="card-body">
                    <form id="noteForm">
                        <div class="mb-3">
                            <label for="noteDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="noteDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="noteText" class="form-label">Note</label>
                            <textarea class="form-control" id="noteText" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Note</button>
                    </form>
                    <hr>
                    <h6>Saved Notes</h6>
                    <ul id="notesList" class="list-group">
                        <!-- Notes will be added here dynamically -->
                    </ul>
                </div>
            </div>
        </div>
