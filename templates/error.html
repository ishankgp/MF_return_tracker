<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Mutual Fund Returns Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="error-page">
    <nav class="navbar app-navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand app-brand" href="/">
                <span class="brand-mark"><i class="bi bi-activity"></i></span>
                <span class="brand-title">Mutual Fund Tracker</span>
            </a>
        </div>
    </nav>

    <div class="container error-shell">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card data-card">
                    <div class="card-body text-center p-5">
                        <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
                        <p class="eyebrow">Dashboard unavailable</p>
                        <h1 class="error-title">Something needs attention</h1>
                        <p class="lead mb-4">{{ error_message }}</p>
                        {% if details %}
                        <details class="error-details text-start">
                            <summary>Error details</summary>
                            <code>{{ details }}</code>
                        </details>
                        {% endif %}
                        <div class="mt-4">
                            <a href="/" class="btn btn-primary me-2">Try Again</a>
                            <button onclick="location.reload()" class="btn btn-outline-secondary">Refresh Page</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5 py-3 bg-white">
        <div class="container text-center">
            <small class="text-muted">Data sourced from AMFI India</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
